<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1830"/>
      <stop offset="1" stop-color="#1a2742"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- horizon glow -->
  <rect x="64" y="300" width="384" height="20" rx="10" fill="url(#sun)" opacity="0.9"/>
  <rect x="104" y="346" width="304" height="14" rx="7" fill="url(#sun)" opacity="0.5"/>
  <!-- sun -->
  <circle cx="256" cy="300" r="86" fill="url(#sun)"/>
  <!-- rays -->
  <g stroke="url(#sun)" stroke-width="16" stroke-linecap="round">
    <line x1="256" y1="118" x2="256" y2="158"/>
    <line x1="146" y1="150" x2="168" y2="186"/>
    <line x1="366" y1="150" x2="344" y2="186"/>
    <line x1="92"  y1="244" x2="132" y2="258"/>
    <line x1="420" y1="244" x2="380" y2="258"/>
  </g>
</svg>
